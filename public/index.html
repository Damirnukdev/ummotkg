<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ummot.kg | Электронная Очередь</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 15px;">
            <img src="./logo.png/unnamed.jpg" alt="" style="width: 120px; height: auto; border-radius: 50%;">
        </div>
        
        <div id="date-time" style="font-size: 14px; color: #666; margin-bottom: 20px; font-weight: bold;">
            Загрузка времени...
        </div>

        <hr style="border: 0.5px solid #eee; margin-bottom: 20px;">

        <div id="setup-screen">
            <h2>Оформление талона</h2>
            <label>Категория:</label>
            <select id="category">
                <option value="COMMON">Общая группа (Здоровые)</option>
                <option value="DCP">Спец. группа (ДЦП и др.)</option>
            </select>
            <label>Количество людей (2-8):</label>
            <input type="number" id="groupSize" min="2" max="8" value="2">
            <button onclick="getTicket()">Получить талон</button>
        </div>

        <div id="ticket-screen" class="hidden">
            <div class="ticket-card">
                <p>Ваш номер очереди:</p>
                <h1 id="ticket-number" style="font-size: 48px; margin: 10px 0;">---</h1>
                
                <div id="qrcode" style="display: flex; justify-content: center; margin: 20px 0;"></div>
                
                <p id="ticket-count">Людей: --</p>
                <div class="status-badge" id="ticket-status">CREATED</div>
            </div>
        </div>
        
        <div id="admin-panel" style="margin-top: 25px; border-top: 1px dashed #ccc; padding-top: 20px;">
            <p style="font-weight: bold; color: #666;">Пульт управления (Тест):</p>
            <button onclick="simulateSecurity()" style="background-color: #28a745; margin-bottom: 5px;">1. Охрана (Пропустить)</button>
            <button onclick="simulateDoctor()" style="background-color: #dc3545;">2. Врач (Подтвердить и Удалить)</button>
        </div>

    </div>
    <script src="javascript.js"></script>
</body>
</html>
